<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Passwort vergessen · Kindler Dach</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/admin.css">
  <script src="/password.js" defer></script>
</head>
<body data-page="forgot-password">
  <main class="login-wrap">
    <a class="admin-brand" href="/" aria-label="Kindler Dach, Startseite">KINDLER<span>DACH.</span></a>
    <section class="login-card">
      <p class="eyebrow">INHABERBEREICH</p>
      <h1>Passwort vergessen?</h1>
      <p class="login-intro">Geben Sie die E-Mail-Adresse Ihres bestehenden Kontos ein. Über den Link in der E-Mail können Sie ein neues Passwort festlegen.</p>
      <form id="forgot-form" class="auth-form">
        <label for="recovery-email">E-Mail-Adresse</label>
        <input id="recovery-email" name="email" type="email" autocomplete="username" required maxlength="254">
        <button class="button" type="submit" disabled>Link anfordern <span aria-hidden="true">↗</span></button>
      </form>
      <p id="password-status" class="notice" role="status" aria-live="polite">Verbindung wird hergestellt …</p>
      <noscript>Bitte aktivieren Sie JavaScript, um einen Link anzufordern.</noscript>
      <a class="back-home" href="/admin/login">Zurück zur Anmeldung</a>
    </section>
  </main>
</body>
</html>
