<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Neues Passwort · Kindler Dach</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/admin.css">
  <script src="/password.js" defer></script>
</head>
<body data-page="reset-password">
  <main class="login-wrap">
    <a class="admin-brand" href="/" aria-label="Kindler Dach, Startseite">KINDLER<span>DACH.</span></a>
    <section class="login-card">
      <p class="eyebrow">INHABERBEREICH</p>
      <h1>Neues Passwort.</h1>
      <p class="login-intro">Wählen Sie ein neues, individuelles Passwort mit mindestens 12 Zeichen.</p>
      <form id="reset-form" class="auth-form" hidden>
        <label for="new-password">Neues Passwort</label>
        <input id="new-password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="72">
        <label for="repeat-password">Neues Passwort wiederholen</label>
        <input id="repeat-password" name="confirmation" type="password" autocomplete="new-password" required minlength="12" maxlength="72">
        <button class="button" type="submit" disabled>Passwort speichern</button>
      </form>
      <p id="password-status" class="notice" role="status" aria-live="polite">Link wird geprüft …</p>
      <noscript>Bitte aktivieren Sie JavaScript, um Ihr Passwort zurückzusetzen.</noscript>
      <a id="request-another-link" class="back-home" href="/admin/forgot-password">Neuen Link anfordern</a><br>
      <a class="back-home" href="/admin/login">Zur Anmeldung</a>
    </section>
  </main>
</body>
</html>
